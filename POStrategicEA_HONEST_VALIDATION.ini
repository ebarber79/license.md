; ============================================================
; CORRECTED STRATEGY TESTER CONFIG for POStrategicEA_ver12
; Revised: 2026.06.16
; Purpose: run an HONEST validation instead of an in-sample,
; curve-fit, optimize-the-martingale run.
;
; KEY CHANGES vs the original cartel_opi_file:
;   - ForwardMode ON (1/3 out-of-sample) -> optimization can't cheat
;   - Date range extended to span 2015 CHF shock + 2020 COVID
;   - Martingale recovery LOCKED OFF (measure the strategy, not the
;     blow-up mechanism)
;   - RiskRewardRatio optimized only in POSITIVE territory (>=1.0)
;   - OptimizationCriterion -> Sharpe (robustness, not raw profit)
;   - Per-trade risk capped to ~1% of the 100k deposit
;
; NOTE: adjust FromDate/ToDate to the history your broker actually
; provides. This validates methodology only; it cannot audit the
; compiled .ex5 logic (still no source).
; ============================================================
[Tester]
Expert=POStrategicEA_ver12.ex5
Symbol=GBPUSD
Period=M1
Optimization=2
Model=4
FromDate=2015.01.01
ToDate=2024.12.31
ForwardMode=2
Deposit=100000
Currency=USD
ProfitInPips=0
Leverage=100
ExecutionMode=10
OptimizationCriterion=5
[TesterInputs]
; STRATEGY SETTINGS
PastXCandlesForHighLow=2||1||1||12||Y
; --- entry timeframe FIXED (don't optimize TF -> avoids fitting)
EntryTF=16392||15||0||16408||N
; LOTSIZE CALCULATION FIXED OR AUTO
Lotsize=0.1||0.1||0.010000||1.000000||N
MoneyManagement=true||false||0||true||N
; POSITION RISK AND TARGETS
; --- ~1% of the 100k deposit, fixed
OriginalPositionRiskAmount=1000||100.0||10.000000||1000.000000||N
; --- CHANGED: optimize ONLY where reward >= risk
RiskRewardRatio=1.5||1.0||0.25||3||Y
; --- LOCKED OFF: measure the strategy, not the martingale
EnableRecoveryTrade=false||false||0||true||N
RecoveryPositionRiskMultiplier=1||1||1||10||N
RecoveryRiskRewardRatio=1.5||0.1||0.05||0.5||N
; TRADING LOCAL TIME SETTINGS
text1001=
StartTime=11:10
; ORIGINAL TRADE TRAILING FEATURE
EnableTrailingOnRecoveryTradeOrig=true||false||0||true||N
StartTrailingAfterPipsProfitOnTradeOrig=0.5||0.4||0.1||1||N
TrailingStopPipsOrig=15||5||5||50||N
; RECOVERY TRADE TRAILING FEATURE
EnableTrailingOnRecoveryTradeRec=true||false||0||true||N
StartTrailingAfterPipsProfitOnTradeRec=0.25||0.1||0.1||0.5||N
TrailingStopPipsRec=10||5||5||50||N
; GENERAL SETTINGS
TakeOrders=3||1||0||3||N
AlertSwitch=true||false||0||true||N
slippage=5||5||1||50||N
MagicNumber=120912||120912||1||1209120||N
TradeComments=POStrategicEA
