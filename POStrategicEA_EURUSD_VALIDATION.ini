; ============================================================
; HONEST VALIDATION CONFIG  -  EURUSD
; Revised: 2026.06.16  |  Expert: POStrategicEA_ver12.ex5
;
; Part of a 3-symbol robustness set (EURUSD / GBPUSD / US30).
; Strategy settings are held IDENTICAL across all three so the
; ONLY variable is the market. If an edge exists on one symbol
; but vanishes on the others, it was curve-fit, not real.
;
; Methodology fixes (same as the GBPUSD master):
;   - ForwardMode ON (1/3 out-of-sample)
;   - Multi-year range spanning 2015 CHF shock + 2020 COVID
;   - Martingale LOCKED OFF
;   - RiskRewardRatio optimized only where reward >= risk
;   - OptimizationCriterion = Sharpe (robustness, not raw profit)
;   - Per-trade risk ~1% of the 100k deposit
; Adjust FromDate/ToDate to the history your broker provides.
; ============================================================
