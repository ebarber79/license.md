<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Neon Dash — Endless Runner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item hud-coins">
        <span class="hud-label">◆</span>
        <span id="coins">0</span>
      </div>
      <div class="hud-item hud-best">
        <span class="hud-label">BEST</span>
        <span id="best">0</span>
      </div>
    </div>

    <!-- Mute toggle -->
    <button id="mute-btn" class="icon-btn" aria-label="Toggle sound">🔊</button>

    <!-- Pause toggle (only during play) -->
    <button id="pause-btn" class="icon-btn icon-btn-left hidden" aria-label="Pause">❚❚</button>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <h1 class="title">NEON<span>DASH</span></h1>
      <p class="tagline">Tap to jump. Tap twice to double-jump.<br />Dodge the spikes, grab the gems.</p>
      <button id="start-btn" class="btn">PLAY</button>

      <div id="shop">
        <div class="shop-head">
          <span>SKINS</span>
          <span class="bank">◆ <span id="bank">0</span></span>
        </div>
        <div id="skin-row"></div>
      </div>

      <div id="qr-box">
        <div id="qr"></div>
        <span class="qr-cap">Scan to play on your phone</span>
      </div>

      <p class="hint">Best: <span id="start-best">0</span></p>
    </div>

    <!-- Pause screen -->
    <div id="pause-screen" class="overlay hidden">
      <h2 class="gameover-title" style="color:#00f5ff;text-shadow:0 0 20px rgba(0,245,255,.7)">PAUSED</h2>
      <button id="resume-btn" class="btn">RESUME</button>
      <button id="quit-btn" class="btn btn-ghost">QUIT</button>
    </div>

    <!-- Game over screen -->
    <div id="gameover-screen" class="overlay hidden">
      <h2 class="gameover-title">GAME OVER</h2>
      <div class="results">
        <div class="result-row"><span>Score</span><span id="final-score">0</span></div>
        <div class="result-row"><span>Gems</span><span id="final-coins">0</span></div>
        <div class="result-row best-row"><span>Best</span><span id="final-best">0</span></div>
      </div>
      <p id="new-record" class="new-record hidden">★ NEW RECORD! ★</p>
      <button id="restart-btn" class="btn">PLAY AGAIN</button>
      <button id="menu-btn" class="btn btn-ghost">MENU &amp; SKINS</button>
    </div>
  </div>

  <script src="analytics.js"></script>
  <script src="qrcode.js"></script>
  <script src="game.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
