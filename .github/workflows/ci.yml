name: CI

on:
  push:
    branches: ["master", "claude/mobile-app-game-tjpjlk"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/unit/*.test.mjs

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (informational)
    runs-on: ubuntu-latest
    continue-on-error: true # non-blocking: reports budgets, never fails the gate
    steps:
      - uses: actions/checkout@v4
      - name: Assemble clean site dir
        run: |
          mkdir -p _lhci_site
          cp index.html style.css game.js analytics.js ads.js engine.js qrcode.js \
             register-sw.js manifest.json sw.js icon.svg _lhci_site/
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
