; ============================================================
; HONEST VALIDATION CONFIG  -  US30  (Dow Jones index CFD)
; Revised: 2026.06.16  |  Expert: POStrategicEA_ver12.ex5
;
; *** READ THIS - US30 IS NOT A FOREX PAIR ***
; This EA was built for FX. Running it on an index is a real
; experiment, not a drop-in. Watch for these gotchas:
;
;  1) SYMBOL NAME varies by broker: US30, US30.cash, DJ30,
;     WS30, DOW, US30Cash... set the EXACT name your broker uses
;     or the test will not run.
;  2) "PIPS" MEAN POINTS HERE. TrailingStopPips=15 is ~15 index
;     points (tiny - the Dow moves 300+ pts/day). The pip-based
;     trailing/SL values below are almost certainly MIS-SCALED
;     for an index and likely need 10x-20x larger distances.
;     The EA's source would tell us how it converts; we don't
;     have it, so treat US30 results with extra suspicion.
;  3) LOT/RISK MATH: index contract size & tick value differ
;     from FX, so OriginalPositionRiskAmount -> lot conversion
;     may behave unexpectedly. Verify position sizes look sane.
;  4) LEVERAGE for indices is usually lower than FX (set to 20
;     here; match your broker). HISTORY is often short - many
;     brokers only have index data from ~2017-2018.
; ============================================================
