<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a3e"/>
      <stop offset="1" stop-color="#3d1f5e"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7afcff"/>
      <stop offset="1" stop-color="#0091ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- ground line -->
  <rect x="40" y="360" width="432" height="8" rx="4" fill="#00f5ff"/>
  <!-- player cube -->
  <rect x="150" y="250" width="110" height="110" rx="18" fill="url(#cube)"/>
  <rect x="220" y="278" width="26" height="26" fill="#0d0d1a"/>
  <!-- spike -->
  <polygon points="330,360 370,280 410,360" fill="#ff4d6d"/>
  <!-- gem -->
  <rect x="318" y="170" width="40" height="40" rx="6" fill="#ffd84d" transform="rotate(45 338 190)"/>
</svg>
